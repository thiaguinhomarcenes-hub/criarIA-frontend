<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriarIA - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #dbd8a2;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #dbd8a2;
            box-shadow: 0 0 0 3px rgba(219, 216, 162, 0.1);
        }

        .button {
            width: 100%;
            padding: 12px;
            background: #dbd8a2;
            color: #333;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(219, 216, 162, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }

        .button.secondary:hover {
            background: #e0e0e0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .link a {
            color: #dbd8a2;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h2 {
            color: #333;
        }

        .logout-btn {
            background: #ff6b6b;
            padding: 8px 16px;
            font-size: 12px;
            width: auto;
        }

        .logout-btn:hover {
            background: #ff5252;
        }

        .dashboard-content {
            display: grid;
            gap: 30px;
        }

        .card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .card h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .result {
            background: white;
            border-left: 4px solid #dbd8a2;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result h4 {
            color: #dbd8a2;
            margin-bottom: 10px;
        }

        .result p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            color: #999;
            font-style: italic;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #dbd8a2;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .image-preview {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-top: 10px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .logout-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="login" class="section active">
            <div class="logo">🎬 CriarIA</div>
            <h2 style="text-align: center; color: #333; margin-bottom: 30px;">Entrar</h2>

            <div class="error" id="loginError"></div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="Sua senha">
            </div>

            <button class="button" onclick="handleLogin()">Entrar</button>

            <div class="link">
                Não tem conta? <a onclick="switchSection('signup')">Criar agora</a>
            </div>
        </div>

        <!-- Signup Section -->
        <div id="signup" class="section">
            <div class="logo">🎬 CriarIA</div>
            <h2 style="text-align: center; color: #333; margin-bottom: 30px;">Criar Conta</h2>

            <div class="error" id="signupError"></div>

            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="signupName" placeholder="Seu nome completo">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="signupPassword" placeholder="Crie uma senha">
            </div>

            <button class="button" onclick="handleSignup()">Criar Conta</button>

            <div class="link">
                Já tem conta? <a onclick="switchSection('login')">Entrar</a>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="section">
            <div class="header">
                <h2>Dashboard</h2>
                <button class="button logout-btn" onclick="handleLogout()">Sair</button>
            </div>

            <div class="error" id="dashboardError"></div>
            <div class="success" id="dashboardSuccess"></div>

            <div class="stats" id="stats">
                <div class="stat">
                    <div class="stat-number" id="roteirosCount">0</div>
                    <div class="stat-label">Roteiros Criados</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="userPlan">-</div>
                    <div class="stat-label">Seu Plano</div>
                </div>
            </div>

            <div class="dashboard-content">
                <div class="card">
                    <h3>Gerar Novo Roteiro</h3>
                    <div class="form-group">
                        <label>Tema/Assunto</label>
                        <input type="text" id="temaRoteiro" placeholder="Ex: Inteligência Artificial em 2026">
                    </div>

                    <div class="form-group">
                        <label>Tom da narração</label>
                        <select id="tomRoteiro" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                            <option value="profissional">Profissional</option>
                            <option value="casual">Casual</option>
                            <option value="entusiasmado">Entusiasmado</option>
                            <option value="critico">Crítico</option>
                        </select>
                    </div>

                    <button class="button" onclick="generateRoteiro()">Gerar Roteiro + Imagem</button>

                    <div class="loading" id="roteirosLoading">
                        Gerando seu roteiro... isso pode levar alguns segundos 🎬
                    </div>

                    <div class="result" id="roteirosResult">
                        <h4>Seu Roteiro</h4>
                        <p id="roteirosText"></p>
                        <h4>Imagem Gerada</h4>
                        <img id="roteirosImage" class="image-preview" src="" alt="Imagem gerada">
                    </div>
                </div>

                <div class="card">
                    <h3>Seus Roteiros Recentes</h3>
                    <div id="roteirosRecentes" style="color: #999; font-size: 14px;">
                        Carregando...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://criaria.onrender.com/api';
        let token = localStorage.getItem('token');

        // Check if user is logged in on load
        window.addEventListener('load', () => {
            if (token) {
                switchSection('dashboard');
                loadUserData();
            }
        });

        function switchSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(section).classList.add('active');
            // Clear errors when switching sections
            document.querySelectorAll('.error').forEach(el => el.classList.remove('show'));
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function showSuccess(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('loginError', 'Preencha email e senha');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    switchSection('dashboard');
                    loadUserData();
                } else {
                    showError('loginError', data.message || 'Erro ao fazer login');
                }
            } catch (error) {
                showError('loginError', 'Erro ao conectar com o servidor');
                console.error(error);
            }
        }

        async function handleSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!name || !email || !password) {
                showError('signupError', 'Preencha todos os campos');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    switchSection('dashboard');
                    loadUserData();
                } else {
                    showError('signupError', data.message || 'Erro ao criar conta');
                }
            } catch (error) {
                showError('signupError', 'Erro ao conectar com o servidor');
                console.error(error);
            }
        }

        async function loadUserData() {
            try {
                const response = await fetch(`${API_URL}/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('roteirosCount').textContent = data.roteirosCount || 0;
                    document.getElementById('userPlan').textContent = data.plan || 'Profissional';
                    loadRoteirosRecentes();
                }
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
            }
        }

        async function loadRoteirosRecentes() {
            try {
                const response = await fetch(`${API_URL}/roteiros`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const roteiros = await response.json();
                    const container = document.getElementById('roteirosRecentes');

                    if (roteiros.length === 0) {
                        container.innerHTML = '<p style="color: #999;">Nenhum roteiro criado ainda</p>';
                        return;
                    }

                    container.innerHTML = roteiros.slice(0, 5).map(r => `
                        <div style="padding: 10px; border-bottom: 1px solid #eee;">
                            <strong>${r.tema}</strong>
                            <p style="font-size: 12px; color: #999; margin: 5px 0 0 0;">
                                ${new Date(r.created_at).toLocaleDateString('pt-BR')}
                            </p>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Erro ao carregar roteiros:', error);
            }
        }

        async function generateRoteiro() {
            const tema = document.getElementById('temaRoteiro').value;
            const tom = document.getElementById('tomRoteiro').value;

            if (!tema) {
                showError('dashboardError', 'Digite um tema para o roteiro');
                return;
            }

            document.getElementById('roteirosLoading').classList.add('show');
            document.getElementById('roteirosResult').classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/roteiros/gerar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ tema, tom })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('roteirosText').textContent = data.roteiro;
                    document.getElementById('roteirosImage').src = data.imagem_url;
                    document.getElementById('roteirosResult').classList.add('show');
                    showSuccess('dashboardSuccess', 'Roteiro gerado com sucesso! 🎉');

                    // Reset form
                    document.getElementById('temaRoteiro').value = '';

                    // Reload user data to update count
                    loadUserData();
                } else {
                    showError('dashboardError', data.message || 'Erro ao gerar roteiro');
                }
            } catch (error) {
                showError('dashboardError', 'Erro ao conectar com o servidor');
                console.error(error);
            } finally {
                document.getElementById('roteirosLoading').classList.remove('show');
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            token = null;
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            switchSection('login');
        }
    </script>
</body>
</html>
