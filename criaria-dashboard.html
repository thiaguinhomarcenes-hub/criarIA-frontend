<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriarIA - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #dbd8a2;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .auth-section {
            display: none;
        }

        .auth-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #dbd8a2;
            box-shadow: 0 0 0 3px rgba(219, 216, 162, 0.2);
        }

        .button {
            width: 100%;
            padding: 12px;
            background: #dbd8a2;
            color: #2c3e50;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 216, 162, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }

        .button-secondary:hover {
            background: #e0e0e0;
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .toggle-text a {
            color: #dbd8a2;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .dashboard-header h2 {
            font-size: 24px;
            color: #333;
        }

        .user-info {
            text-align: right;
        }

        .user-info p {
            color: #666;
            margin-bottom: 10px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #ff5252;
        }

        .section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #dbd8a2;
        }

        .section h3 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }

        .section-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .section-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .user-info {
                text-align: left;
                margin-top: 15px;
            }
        }

        .roteiro-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .roteiro-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .roteiro-card h4 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }

        .roteiro-card p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .message.active {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #dbd8a2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .color-accent {
            color: #dbd8a2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 CriarIA</h1>
            <p>Sua plataforma de IA para criar roteiros Instagram</p>
        </div>

        <div class="content">
            <!-- Auth Section -->
            <div id="authSection" class="auth-section active">
                <!-- Login Form -->
                <div id="loginForm" class="form-container">
                    <h2 style="margin-bottom: 30px; color: #333;">Entrar</h2>
                    <div class="message" id="loginMessage"></div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="loginPassword" placeholder="Sua senha">
                    </div>
                    <button class="button" onclick="handleLogin()">Entrar</button>
                    <div class="toggle-text">
                        Não tem conta? <a onclick="toggleForms()">Criar conta</a>
                    </div>
                </div>

                <!-- Signup Form -->
                <div id="signupForm" class="form-container" style="display: none;">
                    <h2 style="margin-bottom: 30px; color: #333;">Criar Conta</h2>
                    <div class="message" id="signupMessage"></div>
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="signupName" placeholder="Seu nome">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signupEmail" placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="signupPassword" placeholder="Crie uma senha">
                    </div>
                    <button class="button" onclick="handleSignup()">Criar Conta</button>
                    <div class="toggle-text">
                        Já tem conta? <a onclick="toggleForms()">Entrar</a>
                    </div>
                </div>
            </div>

            <!-- Dashboard Section -->
            <div id="dashboardSection" class="dashboard">
                <div class="dashboard-header">
                    <div>
                        <h2>Bem-vindo! 👋</h2>
                    </div>
                    <div class="user-info">
                        <p>Usuário: <strong id="userNameDisplay">-</strong></p>
                        <button class="logout-btn" onclick="handleLogout()">Sair</button>
                    </div>
                </div>

                <!-- Generate Roteiro Section -->
                <div class="section">
                    <h3>📝 Gerar Novo Roteiro</h3>
                    <div class="message" id="roteiroMessage"></div>
                    <div class="loading" id="roteiroLoading">
                        <div class="spinner"></div>
                        <p style="margin-top: 15px; color: #666;">Gerando roteiro com IA...</p>
                    </div>
                    <div id="roteiroForm">
                        <div class="form-group">
                            <label>Tema do Roteiro</label>
                            <input type="text" id="temaInput" placeholder="Ex: Como ganhar dinheiro na internet">
                        </div>
                        <div class="form-group">
                            <label>Tom do Vídeo</label>
                            <select id="tomInput" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                                <option value="profissional">Profissional</option>
                                <option value="casual">Casual</option>
                                <option value="educativo">Educativo</option>
                                <option value="humoristico">Humorístico</option>
                            </select>
                        </div>
                        <button class="button" onclick="handleGenerateRoteiro()">Gerar Roteiro com IA</button>
                    </div>
                    <div id="roteiroResult" style="display: none; margin-top: 20px; padding: 20px; background: white; border-radius: 8px;">
                        <h4 style="margin-bottom: 15px;">Roteiro Gerado:</h4>
                        <p id="roteiroText" style="white-space: pre-wrap; line-height: 1.6; color: #333;"></p>
                        <img id="roteiroImage" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-top: 20px;">
                    </div>
                </div>

                <!-- Roteiros List Section -->
                <div class="section">
                    <h3>📚 Meus Roteiros</h3>
                    <div id="roteirosList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;"></div>
                    <p id="noRoteiros" style="text-align: center; color: #999; padding: 40px 20px;">Nenhum roteiro criado ainda.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Backend URL - CORRIGIDO!
        const BACKEND_URL = 'https://criaria-1.onrender.com';

        let authToken = localStorage.getItem('authToken');
        let userData = localStorage.getItem('userData');

        if (authToken && userData) {
            userData = JSON.parse(userData);
            showDashboard();
        }

        function toggleForms() {
            document.getElementById('loginForm').style.display = document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('signupForm').style.display = document.getElementById('signupForm').style.display === 'none' ? 'block' : 'none';
        }

        async function handleSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!name || !email || !password) {
                showMessage('signupMessage', 'Preencha todos os campos', 'error');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    userData = data.user;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('userData', JSON.stringify(userData));
                    showMessage('signupMessage', 'Conta criada com sucesso!', 'success');
                    setTimeout(showDashboard, 1000);
                } else {
                    showMessage('signupMessage', data.message || 'Erro ao criar conta', 'error');
                }
            } catch (error) {
                console.error('Signup error:', error);
                showMessage('signupMessage', 'Erro de conexão com servidor', 'error');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMessage('loginMessage', 'Preencha email e senha', 'error');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    userData = data.user;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('userData', JSON.stringify(userData));
                    showMessage('loginMessage', 'Login realizado!', 'success');
                    setTimeout(showDashboard, 1000);
                } else {
                    showMessage('loginMessage', data.message || 'Erro ao fazer login', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('loginMessage', 'Erro de conexão com servidor', 'error');
            }
        }

        async function handleGenerateRoteiro() {
            const tema = document.getElementById('temaInput').value;
            const tom = document.getElementById('tomInput').value;

            if (!tema) {
                showMessage('roteiroMessage', 'Escreva um tema para o roteiro', 'error');
                return;
            }

            document.getElementById('roteiroLoading').classList.add('active');
            document.getElementById('roteiroForm').style.opacity = '0.5';
            document.getElementById('roteiroForm').style.pointerEvents = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/api/roteiros/gerar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ tema, tom })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('roteiroText').textContent = data.roteiro;
                    document.getElementById('roteiroImage').src = data.imagem_url;
                    document.getElementById('roteiroResult').style.display = 'block';
                    showMessage('roteiroMessage', 'Roteiro gerado com sucesso!', 'success');
                    loadRoteiros();
                } else {
                    showMessage('roteiroMessage', data.message || 'Erro ao gerar roteiro', 'error');
                }
            } catch (error) {
                console.error('Generate roteiro error:', error);
                showMessage('roteiroMessage', 'Erro de conexão com servidor', 'error');
            } finally {
                document.getElementById('roteiroLoading').classList.remove('active');
                document.getElementById('roteiroForm').style.opacity = '1';
                document.getElementById('roteiroForm').style.pointerEvents = 'auto';
            }
        }

        async function loadRoteiros() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/roteiros`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    const roteiros = await response.json();
                    const container = document.getElementById('roteirosList');
                    const noRoteiros = document.getElementById('noRoteiros');

                    if (roteiros.length === 0) {
                        noRoteiros.style.display = 'block';
                        container.innerHTML = '';
                    } else {
                        noRoteiros.style.display = 'none';
                        container.innerHTML = roteiros.map(r => `
                            <div class="roteiro-card">
                                <img src="${r.imagemUrl}" alt="${r.tema}">
                                <h4>${r.tema}</h4>
                                <p>${r.roteiro.substring(0, 150)}...</p>
                                <small style="color: #999;">Tom: ${r.tom}</small>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Load roteiros error:', error);
            }
        }

        function showDashboard() {
            document.getElementById('authSection').classList.remove('active');
            document.getElementById('dashboardSection').classList.add('active');
            document.getElementById('userNameDisplay').textContent = userData.name;
            loadRoteiros();
        }

        function handleLogout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            authToken = null;
            userData = null;
            document.getElementById('authSection').classList.add('active');
            document.getElementById('dashboardSection').classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `message active ${type}`;
            setTimeout(() => {
                element.classList.remove('active');
            }, 5000);
        }
    </script>
</body>
</html>
