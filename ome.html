<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriarIA - Plataforma de IA para Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 36px; margin-bottom: 10px; color: #667eea; }
        h2 { font-size: 24px; margin-bottom: 30px; color: #333; }
        .status { background: #efe; color: #0a0; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #0a0; }
        .link { display: inline-block; margin-top: 20px; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .link:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 CriarIA</h1>
        <h2>Sua plataforma de IA para Instagram</h2>
        <div class="status">✅ Frontend funcionando!</div>
        <p>Parabéns! Seu frontend está LIVE!</p>
        <p style="margin-top: 20px; color: #999; font-size: 14px;">Backend: criaria.onrender.com</p>
        <a href="https://criaria.onrender.com" class="link">→ Acessar Backend</a>
    </div>
</body>
</html>
